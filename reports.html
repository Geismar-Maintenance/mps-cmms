        <!-- ================= REPORTS MODULE ================= -->
<section id="module-reports" class="module">

  <h4 class="mb-3">Reports</h4>

  <!-- Report Selector -->
  <div class="card p-3 mb-3">

    <h6>Select Report</h6>

    <select id="report-selector"
            class="form-select"
            onchange="handleReportSelection()">

      <option value="">Select a report</option>

      <optgroup label="Inventory">
        <option value="section">Inventory by Cabinet/Section</option>
      </optgroup>

      <optgroup label="Maintenance">
        <!-- future -->
        <option value="wo-performance" disabled>
          Work Order Performance (Coming Soon)
        </option>
      </optgroup>

    </select>

  </div>

  <!-- Report Parameters -->
  <div id="report-params" class="card p-3 mb-3" style="display:none;"></div>

  <!-- Report Output -->
  <div class="card">
    <div class="card-body">

      <div id="report-output" class="text-muted">
        Select a report to begin
      </div>

    </div>
  </div>

</section>
