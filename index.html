<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="favicon.png" type="image/png">
  
  <meta charset="UTF-8" />
  <title>TinWagon CMMS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css"/> 
    

  <!-- Optional styling -->
  <style>
    body {
      background-color: #f8f9fa;
    }
    .sidebar {
      min-height: 100vh;
      background-color: #ffffff;
      border-right: 1px solid #ddd;
    }
    .nav-link {
      cursor: pointer;
    }
   //  .module {
   //    display: none;
  //   }
  //   .module.active {
  //     display: block;
 //    }
  </style>
</head>

<body>

<section id="login-screen" class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <h4 class="mb-3 text-center">TinWagon CMMS Login</h4>

      <form onsubmit="submitLogin(event)">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input
            id="login-username"
            class="form-control"
            type="text"
            autocomplete="username"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">PIN</label>
          <input
            id="login-pin"
            class="form-control"
            type="password"
            inputmode="numeric"
            autocomplete="current-password"
          />
        </div>

        <div class="d-grid">
          <button class="btn btn-primary" type="submit">
            Login
          </button>
        </div>

        <div id="login-error" class="text-danger mt-2" style="display:none;"></div>
      </form>
    </div>
  </div>
</section>

<div id="app-shell" style="display:none;">

<!-- Top Navbar -->
<nav class="navbar navbar-dark bg-primary px-3 d-flex justify-content-between">
  <span class="navbar-brand">TinWagon CMMS</span>

  <div class="text-white d-flex align-items-center gap-3">
  <span id="current-user-label"></span>
  <button class="btn btn-sm btn-outline-info text-white" data-bs-toggle="modal" data-bs-target="#changePinModal">
    Change PIN
  </button>
  <button class="btn btn-sm btn-outline-light" onclick="logout()">
    Logout
  </button>
</div>
</nav>


<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
<aside class="col-md-1 sidebar p-3">
  <h6 class="text-muted mb-3">Modules</h6>

  <nav class="nav flex-column" id="module-nav">

    <!-- Dashboard -->
    <h6 class="text-muted mt-3 mb-2">Dashboard</h6>
    
    <button class="nav-link btn btn-link text-start"
            onclick="switchModule('dashboard', this)">
      Dashboard
    </button>

    <!-- History Section -->
    <h6 class="text-muted mt-3 mb-2">History</h6>

    <button class="nav-link btn btn-link text-start ms-3"
            onclick="switchModule('parts-history', this)">
      Parts History
    </button>

    <button class="nav-link btn btn-link text-start ms-3"
            onclick="switchModule('wo-history', this)">
      Work Order History
    </button>

    <!-- Operations Section -->
    <h6 class="text-muted mt-3 mb-2">Operations</h6>

    <button class="nav-link btn btn-link text-start"
            onclick="switchModule('parts', this)">
      Parts
    </button>
    
    <button class="nav-link btn btn-link text-start"
            onclick="switchModule('workorders', this)">
      Work Orders
    </button>
     <button class="nav-link btn btn-link text-start"
   onclick="switchModule('pm', this)">
   PM
</button>

    <!-- Reports -->   
<h6 class="text-muted mt-3 mb-2">Reports</h6>

<button class="nav-link btn btn-link text-start"
        onclick="switchModule('reports', this)">
  Reports
</button>

    <!-- Administration -->
    <h6 class="text-muted mt-3 mb-2">Administration</h6>
    
    <button class="nav-link btn btn-link text-start"
            onclick="switchModule('admin', this)">
      Administration
    </button>
  </nav>
</aside>
<!-- Main Content -->
<main class="col-md-10 p-4">
  <div id="app-root"></div>
</main>

<!-- Global Modals -->
<div id="modal-root"></div>

 <!-- PINCODE CHANGE MODAL -->

 <div class="modal fade" id="changePinModal" tabindex="-1" aria-labelledby="changePinModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-sm"> <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="changePinModalLabel">Update Security PIN</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Current PIN</label>
          <input type="password" id="pin-current" class="form-control" inputmode="numeric" maxlength="4" placeholder="••••">
        </div>
        <hr>
        <div class="mb-3">
          <label class="form-label">New PIN</label>
          <input type="password" id="pin-new" class="form-control" inputmode="numeric" maxlength="4" placeholder="••••">
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm New PIN</label>
          <input type="password" id="pin-confirm" class="form-control" inputmode="numeric" maxlength="4" placeholder="••••">
        </div>
        <div id="pin-change-error" class="text-danger small" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="submitPinChange()">Update PIN</button>
      </div>
    </div>
  </div>
</div> 
  
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<!-- App JS -->
<script src="app.js"></script> 
<script src="assets.js"></script> 
<script src="dashboard.js"></script>  
<script src="inventory.js"></script>
<script src="parts.js"></script>
<script src="workorders.js"></script>
<script src="admin.js"></script>
<script src="history.js"></script>
<script src="pm.js"></script>
<script src="pmmanagement.js"></script>
<script src="reports.js"></script>

</body>
</html>
