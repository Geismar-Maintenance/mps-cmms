<!-- ================= PM module ================= -->
<section id="pm">
  <div class="container-fluid">

    <div class="row mb-3">
      <div class="col-12">
        <h2 class="border-bottom pb-2">PM Management</h2>
        <p class="text-muted">
          Configure PM templates, trigger blocks, task tiers, tasks, and requirements.
        </p>
      </div>
    </div>

    <div class="row">
      <!-- LEFT PANEL: PM Templates -->
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-header">
            <strong>PM Templates</strong>
            
<button onclick="openAddTemplateModal()">
  + Add PM Template
</button>
          </div>

          <div class="list-group list-group-flush" id="pm-template-list">
            <!-- dynamically loaded -->
            <div class="list-group-item text-muted">
              Loading templates…
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT PANEL: WORKSPACE -->
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-body text-muted text-center py-5" id="pm-management-workspace">
            Select a PM template to begin managing blocks, tasks, and requirements.
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
