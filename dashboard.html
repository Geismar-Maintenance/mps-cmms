<!-- ================= DASHBOARD ================= -->
<section id="module-dashboard" class="module">
+ <section id="dashboard">
  <h4 class="mb-3">Dashboard</h4>

  <div class="row g-3">

    <!-- ✅ WORK ORDERS CARD -->
    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h6 class="card-title">Work Orders</h6>

          <p class="mb-1 clickable-stat" onclick="goToWorkOrders('open')">
            Open:
            <strong id="dash-wo-open">0</strong>
          </p>

          <p class="mb-1 clickable-stat" onclick="goToWorkOrders('overdue')">
            Overdue:
            <strong id="dash-wo-overdue" class="text-danger">0</strong>
          </p>

          <p class="mb-0 clickable-stat" onclick="goToWorkOrders('this_week')">
            Due This Week:
            <strong id="dash-wo-week">0</strong>
          </p>
        </div>
      </div>
    </div>

   <!-- INVENTORY CARD -->
<div class="col-md-4">
  <div class="card">
    <div class="card-body">
      <h6 class="card-title">Inventory</h6>

      <p class="mb-1 clickable-stat">
        Low Stock:
        <strong id="dash-low-stock">0</strong>
      </p>

      <p class="mb-0 clickable-stat">
        Out of Stock:
        <strong id="dash-out-stock" class="text-danger">0</strong>
      </p>
    </div>
  </div>
</div>

    <!-- PLACEHOLDER / FUTURE -->
    <div class="col-md-4">
      <div class="card">
        <div class="card-body text-muted">
          <h6 class="card-title">Coming Soon</h6>
          PM Status, KPIs, Alerts
        </div>
      </div>
    </div>

  </div>
</section>
