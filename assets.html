<!-- ================= ASSETS ================= -->
<section id="assets">
 
<div style="background:red;color:white;padding:10px;">
  ASSETS LOADED
</div>

  <div class="container-fluid">

    <h4 class="mb-3">Assets</h4>

    <div class="row">

      <!-- Asset List -->
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">

            <h6 class="card-title">Assets</h6>

            <ul id="asset-list" class="list-group"></ul>

          </div>
        </div>
      </div>

      <!-- Runtime Entry -->
      <div class="col-md-8">
        <div class="card">
          <div class="card-body">

            <h6 class="card-title">Runtime Entry</h6>

            <div class="mb-2">
              <label>Selected Asset</label>
              <input type="text"
                     id="runtime-asset-name"
                     class="form-control"
                     readonly>
            </div>

            <div class="mb-2">
             <label>Week</label>
             <input type="text"
             id="runtime-week-display"
             class="form-control"
             readonly>

            </div>

            <div class="mb-3">
              <label>Runtime Hours</label>
              <input type="number"
                     id="runtime-hours"
                     class="form-control"
                     step="0.1"
                     min="0">
            </div>

            <button class="btn btn-primary"
                    onclick="submitRuntime()">
              Save Runtime
            </button>

          </div>
        </div>
      </div>

    </div>

  </div>
</section>
