<!-- ================= LOCATION MANAGEMENT MODULE ================= -->
<section id="module-locations" class="module">

  <h4 class="mb-3">Location Manager</h4>

  <!-- Add Range Form -->
  <div class="card p-3 mb-3">

    <div class="row g-2">

      <div class="col-md-2">
        <input id="loc-cabinet" class="form-control" placeholder="Cabinet">
      </div>

      <div class="col-md-2">
        <input id="loc-section" class="form-control" placeholder="Section">
      </div>

      <div class="col-md-2">
        <input id="loc-bin-start" class="form-control" placeholder="Start Bin">
      </div>

      <div class="col-md-2">
        <input id="loc-bin-end" class="form-control" placeholder="End Bin">
      </div>

      <div class="col-md-2">
        <input id="loc-bin-increment" class="form-control" placeholder="Increment">
      </div>

      <div class="col-md-2">
        <button class="btn btn-primary w-100"
                onclick="addLocationRange()">
          Add Range
        </button>
      </div>

    </div>

  </div>

  <!-- Locations Table -->
  <div class="card">
    <div class="card-body">

      <table class="table table-sm table-hover" id="locations-table">
        <thead>
          <tr>
            <th>Cabinet</th>
            <th>Section</th>
            <th>Bin</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

    </div>
  </div>

</section>
